spring:
  application:
    name: videocloud-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/videocloud}
    username: ${SPRING_DATASOURCE_USERNAME:videocloud}
    password: ${SPRING_DATASOURCE_PASSWORD:local_only_change_me}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
server:
  port: ${SERVER_PORT:8080}
