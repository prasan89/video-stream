spring:
  application:
    name: videocloud-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/videocloud}
    username: ${SPRING_DATASOURCE_USERNAME:videocloud}
    password: ${SPRING_DATASOURCE_PASSWORD:local_only_change_me}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
videocloud:
  media-root: ${VIDEO_MEDIA_ROOT:./var/media}
  ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
  max-upload-bytes: ${MAX_UPLOAD_BYTES:2147483648}

billing:
  razorpay:
    mode: ${RAZORPAY_MODE:test}
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    plan-starter: ${RAZORPAY_PLAN_STARTER:}
    plan-pro: ${RAZORPAY_PLAN_PRO:}
