name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: videocloud
          POSTGRES_USER: videocloud
          POSTGRES_PASSWORD: local_only_change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U videocloud -d videocloud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/videocloud
      SPRING_DATASOURCE_USERNAME: videocloud
      SPRING_DATASOURCE_PASSWORD: local_only_change_me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -f services/api/pom.xml test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
