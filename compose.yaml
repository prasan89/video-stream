services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: videocloud
      POSTGRES_USER: videocloud
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - videocloud_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videocloud -d videocloud"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  videocloud_pgdata:
